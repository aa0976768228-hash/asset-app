<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>資產管理</title>
</head>
<body>
<style>
  html,body{ width:100%; overflow-x:hidden; }
</style>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --ink:#222222;
    --ink-soft:#5a6472;
    --paper:#F4F7FA;
    --paper-card:#FFFFFF;
    --hairline:#E1E6ED;
    --navy:#0c3866;
    --navy-soft:#DCE6F0;
    --green:#49c0b6;
    --green-soft:#DEF5F3;
    --rust:#ce181e;
    --rust-soft:#FBDCDD;
    --gold:#ffc20e;
    --gold-soft:#FFF3D1;
    --blue:#007cc0;
    --blue-soft:#DCEEF9;
    --radius:16px;
    --shadow: 0 1px 2px rgba(12,56,102,0.06), 0 6px 20px rgba(12,56,102,0.08);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--paper); }
  #am-root{
    font-family:'Inter', sans-serif; color:var(--ink);
    max-width:480px; margin:0 auto; min-height:100vh;
    background:var(--paper); position:relative; padding-bottom:96px;
    -webkit-font-smoothing:antialiased;
  }
  .am-num{ font-family:'Manrope', sans-serif; font-weight:700; font-variant-numeric: tabular-nums; }

  .am-header{
    position:sticky; top:0; z-index:20;
    background:rgba(244,247,250,0.96);
    border-bottom:1px solid var(--hairline); padding:14px 18px 12px;
  }
  .am-header-top{ display:flex; align-items:center; justify-content:space-between; }
  .am-title{ font-family:'Manrope', sans-serif; font-weight:800; font-size:19px; }
  .am-payday-chip{ display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-soft); cursor:pointer; }
  .am-payday-chip b{ color:var(--ink); font-weight:700; }
  .am-cycle-text{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; }

  .am-body{ padding:16px 16px 8px; }
  .am-subtab-bar{ display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .am-subtab-btn{ flex:1 0 auto; white-space:nowrap; text-align:center; padding:10px 12px; border-radius:10px; border:1px solid var(--hairline); background:var(--paper-card); font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; }
  .am-subtab-btn.sel{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .am-card{
    background:var(--paper-card); border-radius:var(--radius); box-shadow:var(--shadow);
    border:1px solid var(--hairline); padding:18px; margin-bottom:16px;
  }
  .am-section-title{
    font-size:13px; font-weight:700; color:var(--ink-soft); letter-spacing:0.06em; text-transform:uppercase;
    margin:0 0 10px 2px; display:flex; align-items:center; justify-content:space-between;
  }
  .am-add-btn{ border:none; background:none; color:var(--green); font-weight:600; font-size:13px; cursor:pointer; padding:4px 2px; }

  .am-warning-banner{
    background:var(--rust-soft); border:1px solid var(--rust); border-radius:14px; padding:13px 15px;
    margin-bottom:16px; font-size:13px; color:var(--rust);
  }
  .am-warning-banner .t{ font-weight:700; font-size:13.5px; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
  .am-warning-banner ul{ margin:0; padding-left:18px; }
  .am-warning-banner li{ margin-bottom:2px; }

  .am-net-card{ display:flex; align-items:center; gap:18px; }
  .am-net-info{ flex:1; }
  .am-net-eyebrow{ font-size:12px; color:var(--ink-soft); font-weight:600; margin-bottom:4px; }
  .am-net-value{ font-size:28px; font-weight:800; line-height:1.1; }
  .am-net-goal-text{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; }
  .am-net-breakdown{ font-size:12px; color:var(--ink-soft); margin-top:5px; }
  .am-net-breakdown b{ color:var(--ink); font-weight:700; }
  .am-goal-bignum{ font-size:22px; font-weight:800; margin:2px 0; }
  .am-privacy-btn{ border:1px solid var(--hairline); background:var(--paper-card); color:var(--ink-soft); font-size:12px; font-weight:700; border-radius:20px; padding:6px 12px; cursor:pointer; }
  .am-row-grid2{ display:grid; grid-template-columns: 1fr 1fr; gap:2px 14px; }
  .am-row-grid3{ display:grid; grid-template-columns: 46px 1fr 1fr; gap:0 12px; align-items:center; }
  .am-mini-ring{ position:relative; width:44px; height:44px; flex-shrink:0; }
  .am-mini-ring-pct{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800; font-family:'Manrope',sans-serif; color:var(--ink); }
  .am-split-bar{ height:8px; border-radius:6px; overflow:hidden; display:flex; margin-top:10px; background:var(--hairline); }
  .am-net-goal-text b{ color:var(--gold); font-weight:700; }
  .am-ring-wrap{ position:relative; width:92px; height:92px; flex-shrink:0; cursor:pointer; }
  .am-ring-pct{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; font-family:'Manrope',sans-serif; font-weight:800; }
  .am-ring-pct .p{ font-size:18px; }
  .am-ring-pct .l{ font-family:'Inter',sans-serif; font-size:9px; color:var(--ink-soft); font-weight:600; }

  .am-import-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .am-file-btn{ display:inline-flex; align-items:center; gap:6px; background:var(--green); color:#fff; padding:9px 14px; border-radius:10px; font-size:13.5px; font-weight:700; cursor:pointer; border:none; white-space:nowrap; }
  .am-import-status{ font-size:12px; color:var(--ink-soft); margin-top:10px; line-height:1.5; }

  .am-list{ display:flex; flex-direction:column; }
  .am-row{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--hairline); }
  .am-row:last-child{ border-bottom:none; }
  .am-row-main{ flex:1; min-width:0; }
  .am-row-name{ font-size:14.5px; font-weight:600; }
  .am-row-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
  .am-row-amt{ font-family:'Manrope',sans-serif; font-size:15px; font-weight:700; white-space:nowrap; text-align:right; }
  .am-row-del{ border:none; background:none; color:#b7ac8f; cursor:pointer; font-size:16px; padding:2px 4px; }
  .am-empty{ font-size:13px; color:var(--ink-soft); padding:14px 2px; text-align:center; }
  .am-pocket-shortfall{ color:var(--rust); }
  .am-pocket-ok{ color:var(--green); }
  .am-adj-btn{ border:1px solid var(--hairline); background:#fff; color:var(--ink-soft); font-size:12px; font-weight:700; border-radius:8px; padding:3px 8px; cursor:pointer; }
  .am-detail-link{ text-decoration:underline; cursor:pointer; color:var(--blue); font-size:11px; font-weight:600; }

  .am-progress-bar{ height:7px; border-radius:5px; background:var(--hairline); overflow:hidden; margin-top:6px; }
  .am-progress-fill{ height:100%; border-radius:5px; }

  .am-budget-view-bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .am-budget-mode-toggle{ display:flex; flex-shrink:0; }
  .am-seg{ display:flex; gap:8px; }
  .am-seg button{ flex:1; padding:9px; border-radius:10px; border:1px solid var(--hairline); background:#fff; font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink-soft); }
  .am-seg button.sel.inc{ background:var(--green-soft); color:var(--green); border-color:var(--green); }
  .am-seg button.sel.exp{ background:var(--rust-soft); color:var(--rust); border-color:var(--rust); }
  .am-view-toggle{ border:1px solid var(--hairline); background:#fff; padding:6px 14px; font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer; }
  .am-view-toggle:first-child{ border-radius:8px 0 0 8px; }
  .am-view-toggle:last-child{ border-radius:0 8px 8px 0; border-left:none; }
  .am-view-toggle.sel{ background:var(--green-soft); color:var(--green); border-color:var(--green); }
  .am-period-nav{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); }
  .am-period-nav button{ border:none; background:var(--paper); width:24px; height:24px; border-radius:50%; cursor:pointer; font-size:13px; color:var(--ink); }
  .am-period-label{ font-weight:700; color:var(--ink); min-width:64px; text-align:center; }
  .am-budget-basis-row{ display:flex; gap:8px; margin-bottom:8px; }
  .am-basis-chip{ flex:1; padding:7px 8px; border-radius:10px; border:1px solid var(--hairline); background:#fff; font-size:12px; font-weight:700; color:var(--ink-soft); cursor:pointer; }
  .am-basis-chip.sel{ background:var(--gold-soft); color:var(--gold); border-color:var(--gold); }

  .am-checkbox{ width:22px; height:22px; border-radius:7px; border:1.5px solid var(--hairline); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; flex-shrink:0; color:#fff; }
  .am-checkbox.checked{ background:var(--green); border-color:var(--green); }

  .am-manage-link{ text-align:center; font-size:12.5px; color:var(--ink-soft); text-decoration:underline; cursor:pointer; margin:4px 0 2px; }

  .am-quick-tabs{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .am-quick-tab{ padding:6px 12px; border-radius:8px; border:1px solid var(--hairline); background:#fff; font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; }
  .am-quick-tab.sel{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .am-quick-tab.inc.sel{ background:var(--green); border-color:var(--green); }
  .am-quick-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .am-quick-chip{ padding:9px 14px; border-radius:20px; font-size:13.5px; font-weight:700; border:1.5px solid; background:#fff; cursor:pointer; }
  .am-quick-chip.exp{ color:var(--rust); border-color:var(--rust-soft); }
  .am-quick-chip.inc{ color:var(--green); border-color:var(--green-soft); }
  .am-quick-manage-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--hairline); }

  .am-tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:30; max-width:480px; margin:0 auto; display:flex; justify-content:space-around; align-items:flex-end; padding:0 10px 10px; pointer-events:none; }
  .am-tabbar-bg{ position:fixed; left:0; right:0; bottom:0; z-index:29; max-width:480px; margin:0 auto; height:74px; background:rgba(244,247,250,0.96); border-top:1px solid var(--hairline); }
  .am-tab{ pointer-events:auto; flex:1; max-width:100px; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px 8px; border-radius:12px 12px 6px 6px; background:var(--paper-card); border:1px solid var(--hairline); border-bottom:none; cursor:pointer; transform:translateY(6px); transition:transform .15s ease; }
  .am-tab.active{ transform:translateY(-2px); box-shadow:var(--shadow); }
  .am-tab-icon{ font-size:18px; line-height:1; }
  .am-tab-label{ font-size:10.5px; font-weight:700; color:var(--ink-soft); }
  .am-tab.active .am-tab-label{ color:var(--ink); }
  .am-tab.disabled{ opacity:0.55; }

  .am-overlay{ position:fixed; inset:0; background:rgba(12,56,102,0.35); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; }
  .am-sheet{ background:var(--paper-card); width:100%; max-width:440px; border-radius:20px; padding:22px 20px; max-height:82vh; overflow-y:auto; box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
  .am-sheet-title{ font-family:'Manrope',sans-serif; font-size:18px; font-weight:700; margin-bottom:16px; }
  .am-field{ margin-bottom:14px; }
  .am-field-row{ display:flex; gap:10px; margin-bottom:14px; }
  .am-field-row .am-field{ flex:1; margin-bottom:0; }
  .am-field label{ display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .am-field input, .am-field select{ width:100%; border:1px solid var(--hairline); background:#fff; border-radius:10px; padding:10px 12px; font-size:14.5px; font-family:'Inter',sans-serif; color:var(--ink); }
  .am-field input:focus, .am-field select:focus{ outline:2px solid var(--green); outline-offset:1px; }
  .am-sheet-actions{ display:flex; gap:10px; margin-top:18px; }
  .am-btn{ flex:1; padding:12px; border-radius:12px; border:none; font-size:14.5px; font-weight:700; cursor:pointer; }
  .am-btn.primary{ background:var(--green); color:#fff; }
  .am-btn.ghost{ background:none; color:var(--ink-soft); border:1px solid var(--hairline); }
  .am-btn.danger{ background:var(--rust); color:#fff; }
  .am-hint{ font-size:11.5px; color:var(--ink-soft); margin-top:-8px; margin-bottom:14px; }

  .am-toast{ position:fixed; left:50%; bottom:104px; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:20px; font-size:13px; z-index:60; box-shadow:var(--shadow); max-width:80%; text-align:center; }
  .am-loading{ padding:60px 20px; text-align:center; color:var(--ink-soft); font-size:14px; }
</style>

  // ---------- payday / cycle ----------
  function ymKey(y,m){ return y+'-'+pad(m); }
  function dayForYM(ym){ return (state.payday.overrides && state.payday.overrides[ym]) || state.payday.defaultDay || 5; }
  function paydayDate(y,m,day){
    let d = new Date(y, m-1, day);
    const dow = d.getDay();
    if(dow===6) d.setDate(d.getDate()-1);
    if(dow===0) d.setDate(d.getDate()-2);
    d.setHours(0,0,0,0);
    return d;
  }
  function isoDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function getCycle(now){
    const y=now.getFullYear(), m=now.getMonth()+1;
    const thisYM = ymKey(y,m);
    const thisPayday = paydayDate(y,m,dayForYM(thisYM));
    if(now >= thisPayday){
      let ny=y, nm=m+1; if(nm>12){nm=1; ny+=1;}
      const nextYM = ymKey(ny,nm);
      const nextPayday = paydayDate(ny,nm,dayForYM(nextYM));
      return {start:thisPayday, end:nextPayday, key:isoDate(thisPayday)};
    } else {
      let py=y, pm=m-1; if(pm<1){pm=12; py-=1;}
      const prevYM = ymKey(py,pm);
      const prevPayday = paydayDate(py,pm,dayForYM(prevYM));
      return {start:prevPayday, end:thisPayday, key:isoDate(prevPayday)};
    }
  }

  function completedCycles(){
    if(state.ledger.length===0) return [];
    let minDt = state.ledger[0].datetime;
    state.ledger.forEach(l=>{ if(l.datetime<minDt) minDt=l.datetime; });
    const minDate = new Date(minDt.slice(0,10));
    const nowCycle = getCycle(new Date());
    const cycles = [];
    let cur = getCycle(minDate);
    let guard = 0;
    while(cur.start < nowCycle.start && guard<600){
      cycles.push(cur);
      cur = getCycle(cur.end);
      guard++;
    }
    return cycles;
  }

  function avgMonthlyNetFlow(){
    const cycles = completedCycles();
    if(cycles.length===0) return {rate:0, months:0};
    let total = 0;
    cycles.forEach(cy=>{
      const sum = state.ledger.filter(l=>{
        if(EXCLUDED_FLOW_CATS.includes(l.cat1)) return false;
        const d = new Date(l.datetime);
        return d >= cy.start && d < cy.end;
      }).reduce((s,l)=>s+l.amount,0);
      total += sum;
    });
    return {rate: total/cycles.length, months: cycles.length};
  }

  function avgMonthlyInterest(pocket){
    const entries = (pocket.manualAdjustments||[]).filter(a=>a.type==='interest').slice().sort((a,b)=>a.date.localeCompare(b.date));
    if(entries.length===0) return {rate:0, months:0};
    const total = entries.reduce((s,e)=>s+e.amount,0);
    if(entries.length===1) return {rate: total, months: 1};
    const d1 = new Date(entries[0].date), d2 = new Date(entries[entries.length-1].date);
    const months = Math.max((d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth()), 1);
    return {rate: total/months, months};
  }

  function stockEntries(st){ return (st.entries||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)); }
  function stockLatest(st){ const e = stockEntries(st); return e[e.length-1] || {date:'', shares:0, cost:0, marketValue:0}; }
  function stockMonthlyReturnRate(st){
    const e = stockEntries(st);
    if(e.length<2) return null;
    const first = e[0], last = e[e.length-1];
    if(first.date===last.date || !(first.marketValue>0)) return null;
    const d1 = new Date(first.date), d2 = new Date(last.date);
    const months = Math.max((d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth()), 1);
    const growth = last.marketValue / first.marketValue;
    return (Math.pow(growth, 1/months) - 1) * 100;
  }
  const STOCK_INVEST_ACCOUNT = '群益 6000';
  const RATE_WINDOW_CYCLES = 6;
  function avgMonthlyAccountFlow(account){

  function avgMonthlyExpense(account){
    if(!account) return null;
    const byMonth = {};
    state.ledger.forEach(l=>{
      if(l.account!==account) return;
      if(l.type!=='支出') return;
      if(EXCLUDED_FLOW_CATS.includes(l.cat1)) return;

      const ym = l.datetime.slice(0,7);
      byMonth[ym] = (byMonth[ym]||0) + Math.abs(l.amount);
    });
    const months = Object.keys(byMonth);
    if(months.length===0) return null;
    const total = months.reduce((s,m)=>s+byMonth[m],0);
    return total / months.length;
  }

  function categorySpend(budget, prefix, prefixLen){
    const aliases = CATEGORY_ALIASES[budget.name] || [budget.name];
    return state.ledger.filter(l=>{
      if(l.type!=='支出') return false;
      if(EXCLUDED_FLOW_CATS.includes(l.cat1)) return false;
      if(!aliases.includes(l.cat1)) return false;
      return l.datetime.slice(0,prefixLen)===prefix;
    }).reduce((s,l)=>s+Math.abs(l.amount),0);
  }
  function budgetSpentThisMonth(budget){
    const n = new Date();
    return categorySpend(budget, n.getFullYear()+'-'+pad(n.getMonth()+1), 7);
  }
  function budgetSpentForView(budget){
    const len = budgetView.mode==='month' ? 7 : 4;
    return categorySpend(budget, budgetView.period, len);
  }
  function shiftPeriod(view, delta){
    if(view.mode==='month'){
      const [y,m] = view.period.split('-').map(Number);
      const d = new Date(y, m-1+delta, 1);
      view.period = d.getFullYear()+'-'+pad(d.getMonth()+1);
    } else {
      view.period = String(parseInt(view.period,10)+delta);
    }
  }
  function toggleMode(view){
    if(view.mode==='month'){ view.mode='year'; view.period = view.period.slice(0,4); }
    else { const n=new Date(); view.mode='month'; view.period = view.period+'-'+pad(n.getMonth()+1); }
  }
  function yearMonthsElapsed(year){
    const rows = state.ledger.filter(l=>l.datetime.slice(0,4)===String(year));
    if(rows.length===0) return 0;
    const months = rows.map(l=>l.datetime.slice(0,7)).sort();
    const first = months[0], last = months[months.length-1];
    const [fy,fm] = first.split('-').map(Number);
    const [ly,lm] = last.split('-').map(Number);
    return (ly-fy)*12 + (lm-fm) + 1;
  }

  function pocketProjection(pocket, cycle){
    const unpaidFixed = state.fixedExpenses.filter(f=>f.pocketId===pocket.id && !(f.paidCycles&&f.paidCycles[cycle.key]))
      .reduce((s,f)=>s+f.amount,0);
    const remainingBudget = state.budgets.filter(b=>b.pocketId===pocket.id)
      .reduce((s,b)=> s + Math.max(b.amount - budgetSpentThisMonth(b), 0), 0);
    const balance = pocketBalance(pocket);
    return { balance, unpaidFixed, remainingBudget, projected: balance - unpaidFixed - remainingBudget };
  }

    el = document.createElement('div'); el.id='am-toast'; el.className='am-toast'; el.textContent=msg;

          <div>
            <div class="am-row-name">${escapeHtml(l.cat1)}${l.cat2?('・'+escapeHtml(l.cat2)):''}</div>

          <div style="text-align:right;">

          </div>

      const map = {};
      rows.forEach(l=>{

        if(!map[key]) map[key] = {type:l.type, cat1:l.cat1, total:0, count:0};
        map[key].total += Math.abs(l.amount);
        map[key].count += 1;

      const maxTotal = groups.length ? Math.max(...groups.map(g=>g.total)) : 0;
      bodyHtml = groups.length===0 ? '<div class="am-empty">這段期間沒有紀錄</div>' : groups.map(g=>`

            <button id="am-tx-prev">‹</button>
            <span class="am-period-label">${txView.mode==='month'?txView.period:(txView.period+'年')}</span>

  function ringSvg(pct, size, strokeColor, trackColor){
    const clamped = Math.min(Math.max(pct,0),1);
    const stroke = Math.max(Math.round(size*0.13),5);
    const r = (size-stroke)/2, c = 2*Math.PI*r;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${trackColor}" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${strokeColor}" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${c*(1-clamped)}" transform="rotate(-90 ${size/2} ${size/2})"/>
    </svg>`;
  }

  function render(){
    try{ renderInner(); }

      console.error('render error', e);
      root.innerHTML = '<div style="padding:32px 20px;font-family:sans-serif;color:#222222;background:#F4F7FA;min-height:100vh;">'
        + '<div style="font-weight:700;margin-bottom:8px;font-size:16px;">畫面出了一點問題</div>'
        + '<div style="font-size:13px;color:#5a6472;line-height:1.6;">重新整理一次通常就會恢復。如果一直發生,麻煩把下面這行錯誤訊息回報給我:</div>'
        + '<div style="margin-top:10px;font-size:11px;background:#fff;border:1px solid #E1E6ED;border-radius:8px;padding:10px;word-break:break-all;">'
        + String(e && e.message ? e.message : e).replace(/</g,'&lt;') + '</div></div>';
    }
  }

                </div>`;
              }).join('')}
          </div>
        </div>
        ` : ''}

        ${assetSubTab==='預算' ? `
        <div class="am-card">
          <div class="am-section-title">固定支出(預扣帳戶) <button class="am-add-btn" id="am-add-fixed">＋ 新增固定支出</button></div>
          <div class="am-list">
            ${state.fixedExpenses.length===0 ? '<div class="am-empty">還沒有固定支出項目</div>' :
              state.fixedExpenses.map(f=>{
                const pocket = state.pockets.find(p=>p.id===f.pocketId);
                const paid = !!(f.paidCycles && f.paidCycles[cycle.key]);
                return `
                <div class="am-row">
                  <div class="am-checkbox ${paid?'checked':''}" data-toggle-fixed="${f.id}">${paid?'✓':''}</div>

                    <div class="am-row-sub">${pocket?escapeHtml(pocket.name):'未指派口袋'}</div>
                    <div class="am-row-sub">本期(${isoDate(cycle.start)} 起)${paid?'已扣款':'尚未扣款'}</div>
                  </div>
                  <div class="am-row-amt am-num">${fmtMoney(f.amount)}</div>
                  <button class="am-row-del" data-del-fixed="${f.id}" title="刪除">✕</button>
                </div>`;
              }).join('')}
          </div>
        </div>

        <div class="am-card">
          <div class="am-section-title">預算 <button class="am-add-btn" id="am-add-budget">＋ 新增預算</button></div>
          <div class="am-budget-view-bar">
            <div class="am-budget-mode-toggle">
              <button class="am-view-toggle ${budgetView.mode==='month'?'sel':''}" data-budget-mode="month">月</button>
              <button class="am-view-toggle ${budgetView.mode==='year'?'sel':''}" data-budget-mode="year">年</button>
            </div>
            <div class="am-period-nav">
              <button id="am-budget-prev">‹</button>
              <span class="am-period-label">${budgetView.mode==='month'?budgetView.period:(budgetView.period+'年')}</span>
              <button id="am-budget-next">›</button>
            </div>
          </div>
          ${(()=>{ const _ym = budgetView.mode==='year' ? Math.max(yearMonthsElapsed(budgetView.period),1) : 12; return budgetView.mode==='year' ? `
          <div class="am-budget-basis-row">
            <button class="am-basis-chip ${!budgetView.useActualMonths?'sel':''}" data-budget-basis="full">整年預算(×12)</button>
            <button class="am-basis-chip ${budgetView.useActualMonths?'sel':''}" data-budget-basis="actual">實際年預算(×${_ym}個月)</button>
          </div>
          <div class="am-hint" style="margin-top:0;">${budgetView.period}年目前資料從第一筆到最後一筆,共經過 ${_ym} 個月</div>
          ` : ''; })()}
          <div class="am-list">
            ${state.budgets.length===0 ? '<div class="am-empty">還沒有預算項目</div>' :
              (()=>{ const cachedActualMonths = budgetView.mode==='year' ? Math.max(yearMonthsElapsed(budgetView.period),1) : 1; return state.budgets.map(b=>{
                const pocket = state.pockets.find(p=>p.id===b.pocketId);
                const spent = budgetSpentForView(b);
                const months = budgetView.mode==='year' ? (budgetView.useActualMonths ? cachedActualMonths : 12) : 1;
                const displayAmount = b.amount * months;
                const pct = displayAmount>0 ? Math.min(spent/displayAmount,1) : 0;
                const pctDisplay = displayAmount>0 ? Math.round(spent/displayAmount*100) : 0;
                const over = spent>displayAmount;
                return `
                <div class="am-row-grid3" style="padding:11px 0; border-bottom:1px solid var(--hairline);">
                  <div class="am-mini-ring">${ringSvg(pct,44,over?'var(--rust)':'var(--green)','var(--hairline)')}
                    <div class="am-mini-ring-pct">${pctDisplay}%</div>
                  </div>
                  <div>
                    <div class="am-row-name">${escapeHtml(b.name)}</div>
                    <div class="am-row-sub">${pocket?escapeHtml(pocket.name):'未指派口袋'}</div>
                  </div>
                  <div style="text-align:right;">
                    <div class="am-row-sub">已花 ${fmtMoney(spent)} / ${fmtMoney(displayAmount)}</div>
                    <div class="am-row-sub">${over?('<span class="am-pocket-shortfall">超支 '+fmtMoney(spent-displayAmount)+'</span>'):('<span class="am-pocket-ok">剩餘 '+fmtMoney(displayAmount-spent)+'</span>')}</div>
                    <button class="am-row-del" data-del-budget="${b.id}" title="刪除" style="margin-top:2px;">✕</button>
                  </div>
                </div>`;

        </div>
        ` : ''}
      </div>

      <div class="am-tabbar-bg"></div>
      <div class="am-tabbar">
        <div class="am-tab active" data-tab="asset"><div class="am-tab-icon">💰</div><div class="am-tab-label">資產</div></div>
        <div class="am-tab disabled" data-tab="reading"><div class="am-tab-icon">📚</div><div class="am-tab-label">讀書</div></div>
        <div class="am-tab disabled" data-tab="daily"><div class="am-tab-icon">🗓️</div><div class="am-tab-label">日常</div></div>
        <div class="am-tab disabled" data-tab="knowledge"><div class="am-tab-icon">🧠</div><div class="am-tab-label">知識庫</div></div>
      </div>
    `;

    if(modal) html += renderModal(cycle, thisYM);
    root.innerHTML = html;
    attachEvents(cycle, thisYM);
  }

  function renderModal(cycle, thisYM){
    if(modal.type==='editTx'){
      const tx = state.ledger.find(l=>l.id===modal.txId);
      if(!tx) return '';
      if(!modal.pendingType) modal.pendingType = tx.type;
      const pocket = state.pockets.find(p=>p.account===tx.account);
      return `
      <div class="am-overlay" id="am-overlay"><div class="am-sheet">

          <div class="am-seg">
            <button class="${modal.pendingType==='收入'?'sel inc':''}" data-set-etxtype="收入">收入</button>
            <button class="${modal.pendingType==='支出'?'sel exp':''}" data-set-etxtype="支出">支出</button>

        <div class="am-field"><label>大分類</label><input type="text" id="am-etx-cat1" value="${escapeHtml(tx.cat1)}"></div>
        <div class="am-field"><label>細項</label><input type="text" id="am-etx-cat2" value="${escapeHtml(tx.cat2||'')}"></div>
        <div class="am-field"><label>金額</label><input type="number" inputmode="decimal" id="am-etx-amount" value="${Math.abs(tx.amount)}"></div>
        <div class="am-field"><label>口袋</label>
          <select id="am-etx-pocket">
            ${state.pockets.map(p=>`<option value="${p.id}" ${pocket&&pocket.id===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
          </select>
        </div>
        <div class="am-field-row">
          <div class="am-field"><label>日期</label><input type="date" id="am-etx-date" value="${tx.datetime.slice(0,10)}"></div>
          <div class="am-field"><label>時間</label><input type="time" id="am-etx-time" value="${tx.datetime.slice(11,16)}"></div>
        </div>
        <div class="am-field"><label>備註(選填)</label><input type="text" id="am-etx-note" value="${escapeHtml(tx.note||'')}"></div>
        <div class="am-sheet-actions"><button class="am-btn danger" id="am-del-tx">刪除</button><button class="am-btn ghost" id="am-cancel">取消</button><button class="am-btn primary" id="am-save-edittx">儲存</button></div>
      </div></div>`;
    }

    if(modal.type==='quickEntry'){
      const item = [...state.quickItems.expense, ...state.quickItems.income].find(q=>q.id===modal.itemId);
      const suggestedBudget = state.budgets.find(b=>(CATEGORY_ALIASES[b.name]||[b.name]).includes(item.cat1));
      const pocketId = modal.pocketId || (suggestedBudget && suggestedBudget.pocketId) || state.lastPocketId || (state.pockets[0] && state.pockets[0].id);
      return `
      <div class="am-overlay" id="am-overlay"><div class="am-sheet">
        <div class="am-sheet-title">${item.type==='income'?'收入':'支出'}:${escapeHtml(item.cat1)}・${escapeHtml(item.cat2)}</div>
        <div class="am-field"><label>金額</label><input type="number" inputmode="decimal" id="am-qe-amount" placeholder="0" autofocus></div>
        <div class="am-field"><label>從哪個口袋</label>
          <select id="am-qe-pocket">
            ${state.pockets.map(p=>`<option value="${p.id}" ${pocketId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
          </select>
        </div>
        <div class="am-field-row">
          <div class="am-field"><label>日期</label><input type="date" id="am-qe-date" value="${new Date().toISOString().slice(0,10)}"></div>
          <div class="am-field"><label>時間</label><input type="time" id="am-qe-time" value="${new Date().toTimeString().slice(0,5)}"></div>
        </div>
        <div class="am-field"><label>備註(選填)</label><input type="text" id="am-qe-note" placeholder="說明一下"></div>
        <div class="am-sheet-actions"><button class="am-btn ghost" id="am-cancel">取消</button><button class="am-btn primary" id="am-save-quick-entry">儲存</button></div>
      </div></div>`;

    if(modal.type==='manageQuick'){

      return `
      <div class="am-overlay" id="am-overlay"><div class="am-sheet">
        <div class="am-sheet-title">管理快速記帳項目</div>
        <div style="font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;">支出項目</div>
        ${state.quickItems.expense.map(qi=>`
          <div class="am-quick-manage-row">
            <div style="flex:1;font-size:14px;">${escapeHtml(qi.cat1)}・${escapeHtml(qi.cat2)}</div>
            <button class="am-row-del" data-del-quick="${qi.id}">✕</button>
          </div>`).join('') || '<div class="am-empty">尚無支出快速項目</div>'}
        <div style="font-size:12px;font-weight:700;color:var(--ink-soft);margin:14px 0 6px;">收入項目</div>
        ${state.quickItems.income.map(qi=>`
          <div class="am-quick-manage-row">
            <div style="flex:1;font-size:14px;">${escapeHtml(qi.cat1)}・${escapeHtml(qi.cat2)}</div>
            <button class="am-row-del" data-del-quick="${qi.id}">✕</button>
          </div>`).join('') || '<div class="am-empty">尚無收入快速項目</div>'}
        <div style="margin-top:18px; padding-top:14px; border-top:1px solid var(--hairline);">

            <div class="am-seg">
              <button class="${type==='income'?'sel inc':''}" data-set-quicktype="income">收入</button>

            <input type="text" id="am-qi-cat1" list="am-cat1-datalist" placeholder="例如:吃喝" value="${modal.newCat1||''}">

          <div class="am-sheet-actions"><button class="am-btn ghost" id="am-cancel">關閉</button><button class="am-btn primary" id="am-save-quickitem">新增</button></div>
        </div>

    if(modal.type==='addPocket') return `
      <div class="am-overlay" id="am-overlay"><div class="am-sheet">

          </div>

        <div class="am-field"><label>起始餘額</label><input type="number" inputmode="decimal" id="am-pk-balance" value="${modal.startingBalance||0}"></div>
        <div class="am-field"><label>備註(選填)</label><input type="text" id="am-pk-note" placeholder="例如分配策略" value="${modal.note||''}"></div>
        <div class="am-sheet-actions"><button class="am-btn ghost" id="am-cancel">取消</button><button class="am-btn primary" id="am-save-pocket">儲存</button></div>
      </div></div>`;

    if(modal.type==='pocketDetail'){
      const pocket = state.pockets.find(p=>p.id===modal.pocketId);
      if(!pocket) return '';
      const myFixed = state.fixedExpenses.filter(f=>f.pocketId===pocket.id);
      const myBudgets = state.budgets.filter(b=>b.pocketId===pocket.id);
      const fixedRows = myFixed.map(f=>({name:f.name, amount:f.amount, paid:!!(f.paidCycles&&f.paidCycles[cycle.key])}))
        .sort((a,b)=> (a.paid===b.paid)?0:(a.paid?1:-1));
      const budgetRows = myBudgets.map(b=>{
        const spent = budgetSpentThisMonth(b);
        return {name:b.name, amount:b.amount, spent, remaining:b.amount-spent};
      }).sort((a,b)=>a.remaining-b.remaining);
      const proj = pocketProjection(pocket, cycle);

      return `
      <div class="am-overlay" id="am-overlay"><div class="am-sheet">
        <div class="am-sheet-title">「${escapeHtml(pocket.name)}」明細</div>
        <div class="am-hint" style="margin-top:0;">目前餘額 ${fmtMoney(proj.balance)}・預估發薪前剩餘 <b style="color:${proj.projected<0?'var(--rust)':'var(--green)'}">${fmtMoney(proj.projected)}</b></div>

        <div style="font-size:12px;font-weight:700;color:var(--ink-soft);margin:14px 0 6px;">固定支出(本期)</div>
        ${fixedRows.map(r=>`
          <div class="am-row">
            <div class="am-row-main"><div class="am-row-name">${escapeHtml(r.name)}</div></div>
            <div class="am-row-amt am-num" style="color:${r.paid?'var(--green)':'var(--rust)'}">${r.paid?'已扣款':'尚未扣款'}・${fmtMoney(r.amount)}</div>

        ${budgetRows.length>0 ? `
        <div style="font-size:12px;font-weight:700;color:var(--ink-soft);margin:14px 0 6px;">預算(本月)・想省錢就先看排在最上面的</div>

          <div class="am-row">
            <div class="am-row-main"><div class="am-row-name">${escapeHtml(r.name)}</div><div class="am-row-sub">已花 ${fmtMoney(r.spent)} / ${fmtMoney(r.amount)}</div></div>

          <select id="am-tr-from">
            ${state.pockets.map(p=>`<option value="${p.id}" ${modal.fromId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}

        <div class="am-sheet-actions"><button class="am-btn ghost" id="am-cancel">取消</button><button class="am-btn primary" id="am-save-transfer">儲存</button></div>

    if(modal.type==='adjustPocket'){
      const pocket = state.pockets.find(p=>p.id===modal.pocketId);
      const currentBalance = pocket ? pocketBalance(pocket) : 0;
      return `
      <div class="am-overlay" id="am-overlay"><div class="am-sheet">
        <div class="am-sheet-title">微調「${escapeHtml(pocket?pocket.name:'')}」餘額</div>
        <div class="am-hint">目前系統算出來的餘額是 ${fmtMoney(currentBalance)}。直接填「實際應該是多少」,系統會自動算出差額幫你補上。</div>
        <div class="am-field"><label>實際餘額</label><input type="number" inputmode="decimal" id="am-adj-amount" placeholder="填實際餘額,例如 ${Math.round(currentBalance)}" value="${Math.round(currentBalance)}"></div>

        <div class="am-sheet-actions"><button class="am-btn ghost" id="am-cancel">取消</button><button class="am-btn primary" id="am-save-adjust">儲存</button></div>

    if(modal.type==='addInterest'){
      const pocket = state.pockets.find(p=>p.id===modal.pocketId);

    if(modal.type==='addStock') return `
      <div class="am-overlay" id="am-overlay"><div class="am-sheet">

        <div class="am-field"><label>投資成本(總額)</label><input type="number" inputmode="decimal" id="am-st-cost" value="${modal.cost||''}"></div>

      </div></div>`;

    if(modal.type==='addStockEntry'){

        <div class="am-sheet-title">更新「${escapeHtml(st?st.name:'')}」紀錄</div>
        <div class="am-hint">新增一筆有日期的紀錄,才能算出平均每月報酬率跟每月投入金額</div>
        <div class="am-field"><label>日期</label><input type="date" id="am-se-date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="am-field"><label>股數</label><input type="number" inputmode="decimal" id="am-se-shares" value="${latest.shares||''}"></div>
        <div class="am-field"><label>投資成本(累計總額)</label><input type="number" inputmode="decimal" id="am-se-cost" value="${latest.cost||''}"></div>
        <div class="am-field"><label>目前市值(總額)</label><input type="number" inputmode="decimal" id="am-se-value" value="${latest.marketValue||''}"></div>
        <div class="am-sheet-actions"><button class="am-btn ghost" id="am-cancel">取消</button><button class="am-btn primary" id="am-save-stockentry">儲存</button></div>
      </div></div>`;
    }

    if(modal.type==='addDividend'){
      const st = state.stocks.find(s=>s.id===modal.stockId);
      return `
      <div class="am-overlay" id="am-overlay"><div class="am-sheet">
        <div class="am-sheet-title">「${escapeHtml(st?st.name:'')}」記一筆股利</div>
        <div class="am-hint">單純記錄領到的股利金額,累計起來就能看出你的報酬裡有多少是股利貢獻的</div>
        <div class="am-field"><label>日期</label><input type="date" id="am-dv-date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div class="am-field"><label>股利金額</label><input type="number" inputmode="decimal" id="am-dv-amount" placeholder="0"></div>
        <div class="am-sheet-actions"><button class="am-btn ghost" id="am-cancel">取消</button><button class="am-btn primary" id="am-save-dividend">儲存</button></div>
      </div></div>`;
    }

    if(modal.type==='addFixed') return `
      <div class="am-overlay" id="am-overlay"><div class="am-sheet">
        <div class="am-sheet-title">新增固定支出</div>
        <div class="am-field"><label>名稱</label><input type="text" id="am-fx-name" value="${modal.name||''}" placeholder="例如:摩托車保險"></div>
        <div class="am-field"><label>金額</label><input type="number" inputmode="decimal" id="am-fx-amount" value="${modal.amount||''}"></div>
        <div class="am-field"><label>從哪個口袋扣</label>
          <select id="am-fx-pocket">
            <option value="">未指派</option>
            ${state.pockets.map(p=>`<option value="${p.id}" ${modal.pocketId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
          </select>
        </div>
        <div class="am-sheet-actions"><button class="am-btn ghost" id="am-cancel">取消</button><button class="am-btn primary" id="am-save-fixed">儲存</button></div>
      </div></div>`;

    if(modal.type==='addBudget'){
      const selectedPocket = state.pockets.find(p=>p.id===modal.pocketId);
      const avg = selectedPocket ? avgMonthlyExpense(selectedPocket.account) : null;
      return `
      <div class="am-overlay" id="am-overlay"><div class="am-sheet">
        <div class="am-sheet-title">新增預算</div>
        <div class="am-field"><label>名稱</label><input type="text" id="am-bg-name" value="${modal.name||''}" placeholder="例如:餐飲預算"></div>
        <div class="am-field"><label>從哪個口袋出</label>
          <select id="am-bg-pocket">
            <option value="">請選擇口袋</option>
            ${state.pockets.map(p=>`<option value="${p.id}" ${modal.pocketId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
          </select>
        </div>
        ${avg!==null ? `
        <div class="am-hint" style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:-4px;">
          <span>這個口袋過去平均每月花費約 <b class="am-num" style="color:var(--ink);">${fmtMoney(avg)}</b></span>
          <button class="am-adj-btn" id="am-apply-suggest" type="button">套用這個金額</button>
        </div>` : (modal.pocketId ? '<div class="am-hint">這個口袋還沒有足夠的歷史資料可以參考</div>' : '')}
        <div class="am-field"><label>每期預算金額</label><input type="number" inputmode="decimal" id="am-bg-amount" value="${modal.amount||''}" placeholder="你自己決定要抓多少"></div>
        <div class="am-hint">已花金額會自動從匯入的記帳資料裡對這個口袋的支出加總</div>
        <div class="am-sheet-actions"><button class="am-btn ghost" id="am-cancel">取消</button><button class="am-btn primary" id="am-save-budget">儲存</button></div>
      </div></div>`;
    }

    if(modal.type==='setPayday') return `
      <div class="am-overlay" id="am-overlay"><div class="am-sheet">
        <div class="am-sheet-title">設定發薪日</div>
        <div class="am-field"><label>本月(${thisYM})薪水日是幾號</label><input type="number" min="1" max="31" id="am-py-this" value="${dayForYM(thisYM)}"></div>
        <div class="am-field"><label>預設薪水日(其他月份預設用這個)</label><input type="number" min="1" max="31" id="am-py-default" value="${state.payday.defaultDay||5}"></div>
        <div class="am-hint">如果薪水日遇到週六會提前一天、遇到週日會提前兩天,系統會自動算</div>
        <div class="am-sheet-actions"><button class="am-btn ghost" id="am-cancel">取消</button><button class="am-btn primary" id="am-save-payday">儲存</button></div>
      </div></div>`;

    if(modal.type==='savingsGoalForm'){
      const editing = modal.goalId ? (state.savingsGoals||[]).find(g=>g.id===modal.goalId) : null;
      const name = modal.name ?? (editing?editing.name:'');
      const targetKey = modal.targetKey ?? (editing?editing.targetKey:(state.pockets[0]&&state.pockets[0].id));
      const totalTarget = modal.totalTarget ?? (editing?editing.totalTarget:0);
      const monthlyTarget = modal.monthlyTarget ?? (editing?editing.monthlyTarget:0);
      return `
      <div class="am-overlay" id="am-overlay"><div class="am-sheet">
        <div class="am-sheet-title">${editing?'編輯':'新增'}存錢目標</div>
        <div class="am-field"><label>名稱</label><input type="text" id="am-sg-name" placeholder="例如:緊急備用金" value="${escapeHtml(name)}"></div>
        <div class="am-field"><label>選擇帳戶</label>
          <select id="am-sg-target">
            ${state.pockets.map(p=>`<option value="${p.id}" ${targetKey===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
            <option value="STOCK" ${targetKey==='STOCK'?'selected':''}>股票投資(群益)</option>
          </select>
        </div>
        <div class="am-field-row">
          <div class="am-field"><label>目標總額</label><input type="number" inputmode="decimal" id="am-sg-total" value="${totalTarget}"></div>
          <div class="am-field"><label>目標每月存入</label><input type="number" inputmode="decimal" id="am-sg-monthly" value="${monthlyTarget}"></div>
        </div>
        <div class="am-hint">「目標每月存入」會跟你實際轉帳進這個帳戶的紀錄比較(依發薪週期平均計算)</div>
        <div class="am-sheet-actions">${editing?'<button class="am-btn danger" id="am-del-sg-inline">刪除</button>':''}<button class="am-btn ghost" id="am-cancel">取消</button><button class="am-btn primary" id="am-save-savingsgoal">儲存</button></div>
      </div></div>`;
    }

    if(modal.type==='confirmDel') return `
      <div class="am-overlay" id="am-overlay"><div class="am-sheet">
        <div class="am-sheet-title">確定刪除？</div>
        <p style="font-size:13.5px;color:var(--ink-soft);">${escapeHtml(modal.label||'此項目')}刪除後無法復原。</p>
        <div class="am-sheet-actions"><button class="am-btn ghost" id="am-cancel">取消</button><button class="am-btn danger" id="am-confirm-del">刪除</button></div>
      </div></div>`;

    return '';
  }

  function attachEvents(cycle, thisYM){
    const $ = sel=>root.querySelector(sel);

    $('#am-open-payday').onclick = ()=> openModal({type:'setPayday'});
    const privacyBtn = $('#am-toggle-privacy'); if(privacyBtn) privacyBtn.onclick = ()=>{ privacyMode = !privacyMode; render(); };

    const manageQuickBtn = $('#am-manage-quick'); if(manageQuickBtn) manageQuickBtn.onclick = ()=> openModal({type:'manageQuick', newType:'expense'});
    root.querySelectorAll('[data-quick-cat]').forEach(b=>{
      b.onclick = ()=>{ quickCatFilter = b.dataset.quickCat; render(); };
    });
    root.querySelectorAll('[data-quick]').forEach(b=>{
      b.onclick = ()=> openModal({type:'quickEntry', itemId:b.dataset.quick});
    });
    const addSavingsGoalBtn = $('#am-add-savingsgoal'); if(addSavingsGoalBtn) addSavingsGoalBtn.onclick = ()=> openModal({type:'savingsGoalForm'});
    root.querySelectorAll('[data-edit-savingsgoal]').forEach(b=> b.onclick = ()=> openModal({type:'savingsGoalForm', goalId:b.dataset.editSavingsgoal}));
    root.querySelectorAll('[data-del-savingsgoal]').forEach(b=> b.onclick = ()=> openModal({type:'confirmDel', kind:'savingsgoal', id:b.dataset.delSavingsgoal, label:'這個存錢目標'}));

    root.querySelectorAll('[data-asset-subtab]').forEach(b=>{
      b.onclick = ()=>{ assetSubTab = b.dataset.assetSubtab; render(); };
    });
    root.querySelectorAll('[data-tx-mode]').forEach(b=>{
      b.onclick = ()=>{ if(txView.mode!==b.dataset.txMode){ toggleMode(txView); render(); } };
    });
    const tPrev = $('#am-tx-prev'), tNext = $('#am-tx-next');
    if(tPrev) tPrev.onclick = ()=>{ shiftPeriod(txView,-1); render(); };
    if(tNext) tNext.onclick = ()=>{ shiftPeriod(txView,1); render(); };
    root.querySelectorAll('[data-tx-group]').forEach(b=>{
      b.onclick = ()=>{ txView.group = b.dataset.txGroup; if(b.dataset.txGroup==='category') txView.categoryFilter=null; render(); };
    });
    root.querySelectorAll('[data-tx-drilldown]').forEach(b=>{
      b.onclick = ()=>{ txView.categoryFilter = b.dataset.txDrilldown; txView.group = 'detail'; render(); };
    });
    const clearFilterBtn = $('#am-tx-clear-filter'); if(clearFilterBtn) clearFilterBtn.onclick = ()=>{ txView.categoryFilter=null; render(); };
    root.querySelectorAll('[data-edit-tx]').forEach(b=>{
      b.onclick = ()=>{ openModal({type:'editTx', txId:b.dataset.editTx}); };
    });

    const addPocketBtn = $('#am-add-pocket'); if(addPocketBtn) addPocketBtn.onclick = ()=> openModal({type:'addPocket'});
    const transferBtn = $('#am-pocket-transfer'); if(transferBtn) transferBtn.onclick = ()=> openModal({type:'pocketTransfer', fromId:state.pockets[0]&&state.pockets[0].id, toId:state.pockets[1]&&state.pockets[1].id});
    root.querySelectorAll('[data-edit-pocket]').forEach(b=> b.onclick = ()=> openModal({type:'editPocket', pocketId:b.dataset.editPocket}));
    root.querySelectorAll('[data-pocket-detail]').forEach(b=> b.onclick = ()=> openModal({type:'pocketDetail', pocketId:b.dataset.pocketDetail}));
    root.querySelectorAll('[data-adjust-pocket]').forEach(b=> b.onclick = ()=> openModal({type:'adjustPocket', pocketId:b.dataset.adjustPocket}));
    root.querySelectorAll('[data-add-interest]').forEach(b=> b.onclick = ()=> openModal({type:'addInterest', pocketId:b.dataset.addInterest}));
    root.querySelectorAll('[data-del-pocket]').forEach(b=> b.onclick = ()=> openModal({type:'confirmDel', kind:'pocket', id:b.dataset.delPocket, label:'這個口袋'}));

    const addStockBtn = $('#am-add-stock'); if(addStockBtn) addStockBtn.onclick = ()=> openModal({type:'addStock'});
    root.querySelectorAll('[data-add-stock-entry]').forEach(b=> b.onclick = ()=> openModal({type:'addStockEntry', stockId:b.dataset.addStockEntry}));
    root.querySelectorAll('[data-add-dividend]').forEach(b=> b.onclick = ()=> openModal({type:'addDividend', stockId:b.dataset.addDividend}));
    root.querySelectorAll('[data-del-stock]').forEach(b=> b.onclick = ()=> openModal({type:'confirmDel', kind:'stock', id:b.dataset.delStock, label:'這筆持股'}));

    const addFixedBtn = $('#am-add-fixed'); if(addFixedBtn) addFixedBtn.onclick = ()=> openModal({type:'addFixed'});
    root.querySelectorAll('[data-del-fixed]').forEach(b=> b.onclick = ()=> openModal({type:'confirmDel', kind:'fixed', id:b.dataset.delFixed, label:'這筆固定支出'}));
    root.querySelectorAll('[data-toggle-fixed]').forEach(b=>{
      b.onclick = ()=>{
        const f = state.fixedExpenses.find(x=>x.id===b.dataset.toggleFixed);
        if(!f) return;
        f.paidCycles = f.paidCycles || {};
        f.paidCycles[cycle.key] = !f.paidCycles[cycle.key];
        render();
        persist('am2:fixedExpenses', state.fixedExpenses);
      };
    });

    const addBudgetBtn = $('#am-add-budget'); if(addBudgetBtn) addBudgetBtn.onclick = ()=> openModal({type:'addBudget'});
    root.querySelectorAll('[data-budget-mode]').forEach(b=>{
      b.onclick = ()=>{ if(budgetView.mode!==b.dataset.budgetMode){ toggleMode(budgetView); render(); } };
    });
    const bPrev = $('#am-budget-prev'), bNext = $('#am-budget-next');
    if(bPrev) bPrev.onclick = ()=>{ shiftPeriod(budgetView,-1); render(); };
    if(bNext) bNext.onclick = ()=>{ shiftPeriod(budgetView,1); render(); };
    root.querySelectorAll('[data-budget-basis]').forEach(b=>{
      b.onclick = ()=>{ budgetView.useActualMonths = (b.dataset.budgetBasis==='actual'); render(); };
    });
    root.querySelectorAll('[data-del-budget]').forEach(b=> b.onclick = ()=> openModal({type:'confirmDel', kind:'budget', id:b.dataset.delBudget, label:'這筆預算'}));

    root.querySelectorAll('.am-tab').forEach(tab=>{
      tab.onclick = ()=>{ if(tab.dataset.tab==='asset') return; showToast('「'+tab.querySelector('.am-tab-label').textContent+'」頁籤即將推出,敬請期待'); };
    });

    const overlay = $('#am-overlay');
    if(!overlay) return;
    overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
    const cancel = $('#am-cancel'); if(cancel) cancel.onclick = closeModal;

    if(modal.type==='editTx'){
      root.querySelectorAll('[data-set-etxtype]').forEach(b=>{
        b.onclick = ()=>{ modal.pendingType = b.dataset.setEtxtype; render(); };
      });
      $('#am-save-edittx').onclick = ()=>{
        const tx = state.ledger.find(l=>l.id===modal.txId);
        if(!tx) return;
        const cat1 = $('#am-etx-cat1').value.trim();
        const cat2 = $('#am-etx-cat2').value.trim();
        const amount = parseFloat($('#am-etx-amount').value);
        const pocketId = $('#am-etx-pocket').value;
        const date = $('#am-etx-date').value;
        const time = $('#am-etx-time').value || tx.datetime.slice(11,16);
        const note = $('#am-etx-note').value.trim();
        const pocket = state.pockets.find(p=>p.id===pocketId);
        if(!cat1){ showToast('請輸入大分類'); return; }
        if(!amount || amount<=0){ showToast('請輸入正確金額'); return; }
        if(!pocket){ showToast('請選擇口袋'); return; }
        if(!date){ showToast('請選擇日期'); return; }
        tx.type = modal.pendingType || tx.type;
        tx.cat1 = cat1; tx.cat2 = cat2;
        tx.amount = tx.type==='收入' ? Math.abs(amount) : -Math.abs(amount);
        tx.account = pocket.account;
        tx.datetime = date+'T'+time+':00';
        tx.note = note;
        closeModal(); showToast('已更新這筆紀錄');
        persist('am2:ledger', state.ledger);
      };
      $('#am-del-tx').onclick = ()=>{
        state.ledger = state.ledger.filter(l=>l.id!==modal.txId);
        closeModal(); showToast('已刪除這筆紀錄');
        persist('am2:ledger', state.ledger);
      };
    }

    if(modal.type==='quickEntry'){
      $('#am-save-quick-entry').onclick = ()=>{
        const item = [...state.quickItems.expense, ...state.quickItems.income].find(q=>q.id===modal.itemId);
        const amount = parseFloat($('#am-qe-amount').value);
        const pocketId = $('#am-qe-pocket').value;
        const date = $('#am-qe-date').value;
        const time = $('#am-qe-time').value || new Date().toTimeString().slice(0,5);
        const note = $('#am-qe-note').value.trim();
        if(!amount || amount<=0){ showToast('請輸入正確金額'); return; }
        const pocket = state.pockets.find(p=>p.id===pocketId);
        if(!pocket){ showToast('請先新增一個口袋'); return; }
        if(!date){ showToast('請選擇日期'); return; }
        const signed = item.type==='income' ? Math.abs(amount) : -Math.abs(amount);
        state.ledger.push({id:uid('lg'), type:item.type==='income'?'收入':'支出', datetime:date+'T'+time+':00', account:pocket.account, amount:signed, cat1:item.cat1, cat2:item.cat2, note});
        state.lastPocketId = pocketId;
        closeModal(); showToast('已記一筆');
        persist('am2:ledger', state.ledger);
        persist('am2:lastPocket', state.lastPocketId);
      };
    }
    if(modal.type==='manageQuick'){
      root.querySelectorAll('[data-set-quicktype]').forEach(b=>{
        b.onclick = ()=>{ modal.newType=b.dataset.setQuicktype; render(); };
      });
      root.querySelectorAll('[data-del-quick]').forEach(b=>{
        b.onclick = ()=>{
          const id = b.dataset.delQuick;
          state.quickItems.expense = state.quickItems.expense.filter(q=>q.id!==id);
          state.quickItems.income = state.quickItems.income.filter(q=>q.id!==id);
          render();
          persist('am2:quickItems', state.quickItems);
        };
      });
      $('#am-save-quickitem').onclick = ()=>{
        const cat1 = $('#am-qi-cat1').value.trim();
        const cat2 = $('#am-qi-cat2').value.trim();
        if(!cat1 || !cat2){ showToast('請輸入分類名稱'); return; }
        const type = modal.newType||'expense';
        const newItem = {id:uid('qi'), type, cat1, cat2};
        if(type==='income') state.quickItems.income.push(newItem); else state.quickItems.expense.push(newItem);
        modal.newCat1=''; modal.newCat2='';
        render(); showToast('已新增快速項目');
        persist('am2:quickItems', state.quickItems);
      };
    }
    if(modal.type==='addPocket'){
      root.querySelectorAll('[data-set-pkcat]').forEach(b=>{
        b.onclick = ()=>{
          modal.name = $('#am-pk-name').value; modal.startingBalance = $('#am-pk-balance').value; modal.note = $('#am-pk-note').value;
          modal.category = b.dataset.setPkcat; render();
        };
      });
      $('#am-save-pocket').onclick = ()=>{
        const name = $('#am-pk-name').value.trim();
        const bal = parseFloat($('#am-pk-balance').value)||0;
        const note = $('#am-pk-note').value.trim();
        const category = modal.category || 'cash';
        if(!name){ showToast('請輸入口袋名稱'); return; }
        state.pockets.push({id:uid('pk'), account:'manual:'+uid('a'), name, category, note, startingBalance:bal, manualAdjustments:[]});
        closeModal(); showToast('已新增口袋');
        persist('am2:pockets', state.pockets);
      };
    }
    if(modal.type==='editPocket'){
      root.querySelectorAll('[data-set-epcat]').forEach(b=>{
        b.onclick = ()=>{ modal.category = b.dataset.setEpcat; render(); };
      });
      $('#am-save-editpocket').onclick = ()=>{
        const name = $('#am-ep-name').value.trim();
        const note = $('#am-ep-note').value.trim();
        if(!name){ showToast('請輸入口袋名稱'); return; }
        const pocket = state.pockets.find(p=>p.id===modal.pocketId);
        if(pocket){ pocket.name = name; pocket.note = note; if(modal.category) pocket.category = modal.category; }
        closeModal(); showToast('已更新口袋');
        persist('am2:pockets', state.pockets);
      };
    }
    if(modal.type==='pocketTransfer'){
      $('#am-save-transfer').onclick = ()=>{
        const fromId = $('#am-tr-from').value, toId = $('#am-tr-to').value;
        const amount = parseFloat($('#am-tr-amount').value);
        const fee = parseFloat($('#am-tr-fee').value)||0;
        const date = $('#am-tr-date').value;
        const note = $('#am-tr-note').value.trim();
        if(fromId===toId){ showToast('轉出跟轉入不能是同一個口袋'); return; }
        if(!amount || amount<=0){ showToast('請輸入正確金額'); return; }
        if(!date){ showToast('請選擇日期'); return; }
        const fromAccount = fromId==='STOCK' ? STOCK_INVEST_ACCOUNT : (state.pockets.find(p=>p.id===fromId)||{}).account;
        const toAccount = toId==='STOCK' ? STOCK_INVEST_ACCOUNT : (state.pockets.find(p=>p.id===toId)||{}).account;
        if(!fromAccount || !toAccount){ showToast('請選擇口袋'); return; }
        const nowTime = new Date().toTimeString().slice(0,8);
        const dt = date+'T'+nowTime;
        state.ledger.push({id:uid('lg'), type:'支出', datetime:dt, account:fromAccount, amount:-amount, cat1:'轉帳', cat2:'轉帳', note});
        state.ledger.push({id:uid('lg'), type:'收入', datetime:dt, account:toAccount, amount:amount, cat1:'轉帳', cat2:'轉帳', note});
        if(fee>0){
          state.ledger.push({id:uid('lg'), type:'支出', datetime:dt, account:fromAccount, amount:-fee, cat1:'手續費', cat2:'轉帳手續費', note});
        }
        closeModal(); showToast('已完成轉帳');
        persist('am2:ledger', state.ledger);
      };
    }
    if(modal.type==='adjustPocket'){
      $('#am-save-adjust').onclick = ()=>{
        const targetBalance = parseFloat($('#am-adj-amount').value);
        const note = $('#am-adj-note').value.trim();
        if(targetBalance===undefined || targetBalance===null || isNaN(targetBalance)){ showToast('請輸入實際餘額'); return; }
        const pocket = state.pockets.find(p=>p.id===modal.pocketId);
        if(!pocket) return;
        const currentBalance = pocketBalance(pocket);
        const diff = targetBalance - currentBalance;
        if(diff===0){ showToast('跟目前算出來的餘額一樣,不用調整'); closeModal(); return; }
        pocket.manualAdjustments = pocket.manualAdjustments || [];
        pocket.manualAdjustments.push({id:uid('adj'), date:new Date().toISOString().slice(0,10), amount:diff, note: note || ('校正為實際餘額 '+fmtMoney(targetBalance))});
        closeModal(); showToast('已調整餘額');
        persist('am2:pockets', state.pockets);
      };
    }
    if(modal.type==='addInterest'){
      $('#am-save-interest').onclick = ()=>{
        const date = $('#am-int-date').value;
        const amount = parseFloat($('#am-int-amount').value);
        if(!date){ showToast('請選擇日期'); return; }
        if(!amount || amount<=0){ showToast('請輸入正確的利息金額'); return; }
        const pocket = state.pockets.find(p=>p.id===modal.pocketId);
        pocket.manualAdjustments = pocket.manualAdjustments || [];
        pocket.manualAdjustments.push({id:uid('adj'), date, amount, note:'利息入帳', type:'interest'});
        closeModal(); showToast('已記錄這筆利息');
        persist('am2:pockets', state.pockets);
      };
    }
    if(modal.type==='addStock'){
      $('#am-save-stock').onclick = ()=>{
        const name = $('#am-st-name').value.trim();
        const date = $('#am-st-date').value;
        const shares = parseFloat($('#am-st-shares').value)||0;
        const cost = parseFloat($('#am-st-cost').value)||0;
        const marketValue = parseFloat($('#am-st-value').value)||0;
        if(!name){ showToast('請輸入股票名稱'); return; }
        if(!date){ showToast('請選擇日期'); return; }
        state.stocks.push({id:uid('st'), name, entries:[{id:uid('se'), date, shares, cost, marketValue}]});
        closeModal(); showToast('已新增持股');
        persist('am2:stocks', state.stocks);
      };
    }
    if(modal.type==='addStockEntry'){
      $('#am-save-stockentry').onclick = ()=>{
        const st = state.stocks.find(s=>s.id===modal.stockId);
        if(!st) return;
        const date = $('#am-se-date').value;
        const shares = parseFloat($('#am-se-shares').value)||0;
        const cost = parseFloat($('#am-se-cost').value)||0;
        const marketValue = parseFloat($('#am-se-value').value)||0;
        if(!date){ showToast('請選擇日期'); return; }
        st.entries = st.entries || [];
        st.entries = st.entries.filter(e=>e.date!==date); // 同一天重複更新就覆蓋掉
        st.entries.push({id:uid('se'), date, shares, cost, marketValue});
        closeModal(); showToast('已更新這筆股票紀錄');
        persist('am2:stocks', state.stocks);
      };
    }
    if(modal.type==='addDividend'){
      $('#am-save-dividend').onclick = ()=>{
        const st = state.stocks.find(s=>s.id===modal.stockId);
        if(!st) return;
        const date = $('#am-dv-date').value;
        const amount = parseFloat($('#am-dv-amount').value);
        if(!date){ showToast('請選擇日期'); return; }
        if(!amount || amount<=0){ showToast('請輸入正確的股利金額'); return; }
        st.dividends = st.dividends || [];
        st.dividends.push({id:uid('dv'), date, amount});
        closeModal(); showToast('已記錄這筆股利');
        persist('am2:stocks', state.stocks);
      };
    }
    if(modal.type==='addFixed'){
      $('#am-save-fixed').onclick = ()=>{
        const name = $('#am-fx-name').value.trim();
        const amount = parseFloat($('#am-fx-amount').value);
        const pocketId = $('#am-fx-pocket').value || null;
        if(!name){ showToast('請輸入名稱'); return; }
        if(!amount || amount<=0){ showToast('請輸入正確金額'); return; }
        state.fixedExpenses.push({id:uid('fx'), name, amount, pocketId, paidCycles:{}});
        closeModal(); showToast('已新增固定支出');
        persist('am2:fixedExpenses', state.fixedExpenses);
      };
    }
    if(modal.type==='addBudget'){
      const pocketSel = $('#am-bg-pocket');
      if(pocketSel) pocketSel.onchange = ()=>{
        modal.name = $('#am-bg-name').value;
        modal.amount = $('#am-bg-amount').value;
        modal.pocketId = pocketSel.value || null;
        render();
      };
      const applyBtn = $('#am-apply-suggest');
      if(applyBtn) applyBtn.onclick = ()=>{
        const pocket = state.pockets.find(p=>p.id===modal.pocketId);
        const avg = pocket ? avgMonthlyExpense(pocket.account) : null;
        if(avg!==null){ modal.amount = Math.round(avg); modal.name = $('#am-bg-name').value; render(); }
      };
      $('#am-save-budget').onclick = ()=>{
        const name = $('#am-bg-name').value.trim();
        const amount = parseFloat($('#am-bg-amount').value);
        const pocketId = $('#am-bg-pocket').value || null;
        if(!name){ showToast('請輸入名稱'); return; }
        if(!pocketId){ showToast('請選擇口袋'); return; }
        if(!amount || amount<=0){ showToast('請輸入正確金額'); return; }
        state.budgets.push({id:uid('bg'), name, amount, pocketId});
        closeModal(); showToast('已新增預算');
        persist('am2:budgets', state.budgets);
      };
    }
    if(modal.type==='setPayday'){
      $('#am-save-payday').onclick = ()=>{
        const thisDay = parseInt($('#am-py-this').value);
        const defDay = parseInt($('#am-py-default').value);
        state.payday.overrides = state.payday.overrides || {};
        if(thisDay) state.payday.overrides[thisYM] = thisDay;
        if(defDay) state.payday.defaultDay = defDay;
        closeModal(); showToast('已更新發薪日設定');
        persist('am2:payday', state.payday);
      };
    }
    if(modal.type==='savingsGoalForm'){
      $('#am-save-savingsgoal').onclick = ()=>{
        const name = $('#am-sg-name').value.trim();
        const targetKey = $('#am-sg-target').value;
        const totalTarget = parseFloat($('#am-sg-total').value)||0;
        const monthlyTarget = parseFloat($('#am-sg-monthly').value)||0;
        if(!name){ showToast('請輸入名稱'); return; }
        if(!targetKey){ showToast('請選擇帳戶'); return; }
        state.savingsGoals = state.savingsGoals || [];
        if(modal.goalId){
          const g = state.savingsGoals.find(x=>x.id===modal.goalId);
          if(g){ g.name=name; g.targetKey=targetKey; g.totalTarget=totalTarget; g.monthlyTarget=monthlyTarget; }
        } else {
          state.savingsGoals.push({id:uid('sg'), name, targetKey, totalTarget, monthlyTarget});
        }
        closeModal(); showToast('已儲存存錢目標');
        persist('am2:savingsGoals', state.savingsGoals);
      };
      const delInline = $('#am-del-sg-inline');
      if(delInline) delInline.onclick = ()=>{
        state.savingsGoals = (state.savingsGoals||[]).filter(g=>g.id!==modal.goalId);
        closeModal(); showToast('已刪除');
        persist('am2:savingsGoals', state.savingsGoals);
      };
    }
    if(modal.type==='confirmDel'){
      $('#am-confirm-del').onclick = ()=>{
        const {kind,id} = modal;
        if(kind==='pocket'){ state.pockets = state.pockets.filter(p=>p.id!==id); persist('am2:pockets', state.pockets); }
        if(kind==='stock'){ state.stocks = state.stocks.filter(s=>s.id!==id); persist('am2:stocks', state.stocks); }
        if(kind==='fixed'){ state.fixedExpenses = state.fixedExpenses.filter(f=>f.id!==id); persist('am2:fixedExpenses', state.fixedExpenses); }
        if(kind==='budget'){ state.budgets = state.budgets.filter(b=>b.id!==id); persist('am2:budgets', state.budgets); }
        if(kind==='savingsgoal'){ state.savingsGoals = (state.savingsGoals||[]).filter(g=>g.id!==id); persist('am2:savingsGoals', state.savingsGoals); }
        modal=null; render(); showToast('已刪除');
      };
    }
  }

  loadAll().catch(e=>{
    console.error('loadAll fatal error', e);
    root.innerHTML = '<div style="padding:32px 20px;font-family:sans-serif;color:#222222;background:#F4F7FA;min-height:100vh;">'
      + '<div style="font-weight:700;margin-bottom:8px;font-size:16px;">載入時發生錯誤</div>'
      + '<div style="font-size:13px;color:#5a6472;line-height:1.6;">重新整理一次通常就會恢復。如果一直發生,麻煩把下面這行錯誤訊息回報給我:</div>'
      + '<div style="margin-top:10px;font-size:11px;background:#fff;border:1px solid #E1E6ED;border-radius:8px;padding:10px;word-break:break-all;">'
      + String(e && e.message ? e.message : e).replace(/</g,'&lt;') + '</div></div>';
  });
})();
</script>
</body>
</html>
